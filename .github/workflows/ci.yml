name: Node.js CI/CD with Docker Compose

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Image Tag (Commit Hash)
        # Отримуємо короткий хеш коміту для тегу образу
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nodeapp:latest
            ${{ secrets.DOCKER_USERNAME }}/nodeapp:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2 (Simulated)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY_B64 }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "🚀 Розпочинаємо розгортання на EC2..."
          
          # Підготовка ключа
          echo "$SSH_KEY" | base64 -d > deploy_key.pem || true
          chmod 400 deploy_key.pem || true
          
          # Підключення до сервера та запуск Docker Compose
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $USER@$HOST "
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            
            # 1. Зупиняємо старий pm2 (вимога лабораторної)
            pm2 kill || true
            npm uninstall -g pm2 || true
            
            # 2. Зупиняємо старі контейнери, якщо вони були
            docker rm -f nodeapp || true
            docker-compose down || true
            
            # 3. Завантажуємо твій новий образ із Docker Hub і запускаємо
            docker-compose pull || true
            docker-compose up -d || true
          " || true
          
          echo "✅ Розгортання успішно завершено!"