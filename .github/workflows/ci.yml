name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # --- Кроки з Лабораторної 5 ---
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run build
      run: npm run build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-result
        path: .

    # --- НОВІ КРОКИ ДЛЯ ЛАБОРАТОРНОЇ 6 ---
    
    # 1. Розшифровка ключа SSH
    - name: Decode SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem || true
        chmod 600 ec2-key.pem || true

    # 2. Копіювання файлів на EC2 (імітація)
    - name: Deploy to EC2 (rsync)
      run: |
        rsync -avz -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no" --exclude='.git' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/nodeapp || true

    # 3. Запуск застосунку на EC2 (імітація)
    - name: Restart app on EC2
      run: |
        ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF' || true
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g pm2
          cd /home/${{ secrets.EC2_USER }}/nodeapp
          npm install
          pm2 restart all || pm2 start index.js --name "my-app"
        EOF