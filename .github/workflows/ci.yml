name: Node.js CI Pipeline

# Запускати при кожному push до гілки main
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # Середовище (ОС Ubuntu)
    runs-on: ubuntu-latest

    steps:
    # 1. Завантаження коду репозиторію
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Установлення Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Установлення залежностей
    - name: Install dependencies
      run: npm install

    # 4. Запуск білд-процесу
    - name: Run build
      run: npm run build

    # 5. Збереження результату як артефакту
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-result
        path: . # Зберігає весь каталог як артефакт, щоб нічого не загубити